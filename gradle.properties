# 6g rather than the usual 4g: linking the iOS release frameworks runs in the daemon and
# exhausts a 4 GiB heap when it overlaps the other targets under org.gradle.parallel.
# Kept below 7g so the build still starts on a GitHub macOS runner.
org.gradle.jvmargs = -Xmx6g -XX:MaxMetaspaceSize=2g
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true

# Toolchain
jvm.toolchain = 17

# Android
android.compileSdk = 37
android.targetSdk = 37
android.minSdk = 26

# Maven Publish
SONATYPE_HOST=CENTRAL_PORTAL
