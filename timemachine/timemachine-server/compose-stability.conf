// Types this module's state holds that come from modules not compiled with Compose. The compiler
// cannot see that they are immutable, so it would compare them, and every class that holds one, by
// identity. Each one here never changes once built: Compose may compare two of them by equals.
// A comment must start its line: the compiler rejects one written after a class name.

// The standard library's identifiers and instants.
kotlin.uuid.Uuid
kotlin.time.Instant

// The TimeMachine protocol (vie-timemachine-shared): data classes of vals, enums and sealed interfaces.
// The double wildcard also takes the nested classes, such as VIEInterventionResult.Failure.
org.kodein.arch.vie.timemachine.protocol.**

// The JSON tree of kotlinx.serialization: an element never changes once parsed or built.
kotlinx.serialization.json.JsonElement
kotlinx.serialization.json.JsonObject
kotlinx.serialization.json.JsonArray
kotlinx.serialization.json.JsonPrimitive
kotlinx.serialization.json.JsonNull
