[versions]
androidx-jb-lifecycle = "2.11.0"            # https://github.com/JetBrains/compose-multiplatform/releases
androidx-jb-navigation3 = "1.2.0-alpha02"   # https://github.com/JetBrains/compose-multiplatform/releases
androidx-navigation3 = "1.2.0-alpha06"      # https://github.com/JetBrains/compose-multiplatform/releases
compose-material3 = "1.12.0-alpha03"        # https://github.com/JetBrains/compose-multiplatform/releases
compose-materialIcons = "1.7.3"             # https://mvnrepository.com/artifact/org.jetbrains.compose.material/material-icons-extended
compose-multiplatform = "1.12.0"            # https://github.com/JetBrains/compose-multiplatform/releases
coroutines = "1.11.0"                       # https://github.com/Kotlin/kotlinx.coroutines/releases
inara = "0.1.0"
kotlin = "2.4.10"                           # https://kotlinlang.org/docs/releases.html#release-history
ksp = "2.3.11"                              # https://github.com/google/ksp/releases
mavenPublish = "0.37.0"                     # https://github.com/vanniktech/gradle-maven-publish-plugin/releases

[plugins]
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

[libraries]
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-jb-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-jb-lifecycle" }
androidx-jb-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-jb-lifecycle" }
androidx-jb-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-jb-navigation3" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-materialIcons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-materialIcons" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
inara-processor = { module = "org.kodein.di.inara:inara-processor", version.ref = "inara"}
inara-runtime = { module = "org.kodein.di.inara:inara-runtime", version.ref = "inara"}
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
