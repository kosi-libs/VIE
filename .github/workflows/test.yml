name: check

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  workflow_dispatch:

jobs:

  check:
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew --stacktrace --scan build
        shell: bash
