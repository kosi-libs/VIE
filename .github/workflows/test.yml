name: check

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  workflow_dispatch:

jobs:

  check:
    runs-on: [self-hosted, macOS, ARM64, vie]
    steps:
      - name: Setup
        uses: KodeinKoders/kodein-github-actions/gradle-kotlin-setup@v0.3
      - name: Build
        run: ./gradlew --stacktrace --scan build
        shell: bash
      # The Swift helpers need a Swift 6.2 toolchain (Xcode 26): the log says which one compiled them.
      - name: Show the Xcode version
        run: xcodebuild -version
        shell: bash
      # Compiles skills/vie/swift, which no Gradle task does, against the demo's Kotlin framework.
      - name: Build the SwiftUI demo
        run: >
          xcodebuild
          -project demo/demo-swiftui/kosi-vie-swiftui-demo/kosi-vie-swiftui-demo.xcodeproj
          -scheme kosi-vie-swiftui-demo
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          build
        shell: bash
      # Runs the tests of the Swift helpers, in a simulator of this runner's own: several runners share
      # one machine, and two jobs must not install the app on the same device. A simulator that never
      # started takes minutes to be ready, and installing an app before that hangs, hence bootstatus,
      # which waits for the end of the boot.
      - name: Test the Swift helpers
        timeout-minutes: 30
        run: |
          device="vie-ci-$RUNNER_NAME"
          xcrun simctl list devices | grep -qF "$device (" || xcrun simctl create "$device" "iPhone 17"
          xcrun simctl bootstatus "$device" -b
          xcodebuild \
            -project demo/demo-swiftui/kosi-vie-swiftui-demo/kosi-vie-swiftui-demo.xcodeproj \
            -scheme kosi-vie-swiftui-demo \
            -destination "platform=iOS Simulator,name=$device" \
            -parallel-testing-enabled NO \
            test
        shell: bash
      - name: Shut the simulator down
        if: always()
        run: xcrun simctl shutdown "vie-ci-$RUNNER_NAME" || true
        shell: bash
      # The demo project is in the Swift 5 language mode: the same sources must compile in the Swift 6
      # mode too, with its complete concurrency checking, for the apps that have moved to it.
      - name: Build the SwiftUI demo in the Swift 6 language mode
        run: >
          xcodebuild
          -project demo/demo-swiftui/kosi-vie-swiftui-demo/kosi-vie-swiftui-demo.xcodeproj
          -scheme kosi-vie-swiftui-demo
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          SWIFT_VERSION=6
          build
        shell: bash
      # The same helpers, in an app that mixes SwiftUI with a Compose screen.
      - name: Build the mixed iOS demo
        run: >
          xcodebuild
          -project demo/demo-ios/kosi-vie-demo/kosi-vie-demo.xcodeproj
          -scheme kosi-vie-demo
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          build
        shell: bash
