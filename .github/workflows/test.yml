name: check

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  workflow_dispatch:

jobs:

  check:
    runs-on: [self-hosted, macOS, ARM64, vie]
    steps:
      - name: Setup
        uses: KodeinKoders/kodein-github-actions/gradle-kotlin-setup@v0.3
      - name: Build
        run: ./gradlew --stacktrace --scan build
        shell: bash
      # The Swift helpers need a Swift 6.2 toolchain (Xcode 26): the log says which one compiled them.
      - name: Show the Xcode version
        run: xcodebuild -version
        shell: bash
      # Compiles skills/vie/swift, which no Gradle task does, against the demo's Kotlin framework.
      - name: Build the SwiftUI demo
        run: >
          xcodebuild
          -project demo/demo-swiftui/kosi-vie-swiftui-demo/kosi-vie-swiftui-demo.xcodeproj
          -scheme kosi-vie-swiftui-demo
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          build
        shell: bash
      # The demo project is in the Swift 5 language mode: the same sources must compile in the Swift 6
      # mode too, with its complete concurrency checking, for the apps that have moved to it.
      - name: Build the SwiftUI demo in the Swift 6 language mode
        run: >
          xcodebuild
          -project demo/demo-swiftui/kosi-vie-swiftui-demo/kosi-vie-swiftui-demo.xcodeproj
          -scheme kosi-vie-swiftui-demo
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          SWIFT_VERSION=6
          build
        shell: bash
