name: check

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  workflow_dispatch:

jobs:

  check:
    runs-on: macOS-latest
    steps:
      - name: Setup
        uses: KodeinKoders/kodein-github-actions/gradle-kotlin-setup@v0.3
      - name: Build
        run: ./gradlew --stacktrace --scan build
        shell: bash
